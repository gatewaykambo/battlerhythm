# War Party TOC source list.
# lane: a starting hint for the scorer (active_duty, veterans, first_responders, plant_medicine, mixed)
#   plant_medicine is the Integrative Health & Policy lane.
# kind: "news" (default) or "policy" (rulemaking, bills, court and agency actions)
# weight: nudges the score (1.0 normal, 1.1 for the most trusted outlets)
# type: "rss" (default) or "gdelt" (a search of the GDELT global news index; returns real article links)
#
# Every sweep lists failing feeds in its run summary, so a dead address shows up quickly.

feeds:
  # ---------- Military and defense (covered worldwide) ----------
  - name: Military Times
    url: https://www.militarytimes.com/arc/outboundfeeds/rss/?outputType=xml
    lane: mixed
    weight: 1.1
  - name: Defense News
    url: https://www.defensenews.com/arc/outboundfeeds/rss/?outputType=xml
    lane: active_duty
  - name: Stars and Stripes
    url: https://www.stripes.com/arc/outboundfeeds/rss/?outputType=xml
    lane: mixed
    weight: 1.1
  - name: Task & Purpose
    url: https://taskandpurpose.com/feed/
    lane: mixed
  - name: USNI News
    url: https://news.usni.org/feed
    lane: active_duty
  - name: Air & Space Forces Magazine
    url: https://www.airandspaceforces.com/feed/
    lane: active_duty
  - name: Breaking Defense
    url: https://breakingdefense.com/feed/
    lane: active_duty
  - name: Federal News Network
    url: https://federalnewsnetwork.com/feed/
    lane: mixed
  - name: GDELT · U.S. forces worldwide
    type: gdelt
    query: '("U.S. troops" OR "service members" OR Pentagon OR "U.S. military" OR "military families") sourcelang:english'
    lane: active_duty

  # ---------- Veterans and the VA (U.S.) ----------
  - name: The War Horse
    url: https://thewarhorse.org/feed/
    lane: veterans
    weight: 1.1
  - name: VA News
    url: https://news.va.gov/feed/
    lane: veterans
  - name: Federal Register · VA documents
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=veterans-affairs-department
    lane: veterans
    kind: policy
  - name: GDELT · veterans
    type: gdelt
    query: '(veterans OR "Veterans Affairs" OR "PACT Act" OR "burn pits") sourcecountry:US sourcelang:english'
    lane: veterans

  # ---------- First responders (U.S.) ----------
  - name: GDELT · firefighters
    type: gdelt
    query: '(firefighters OR "fire department") (cancer OR PTSD OR staffing OR benefits OR union OR bill) sourcecountry:US sourcelang:english'
    lane: first_responders
  - name: GDELT · police, EMS, dispatch
    type: gdelt
    query: '(police OR paramedics OR EMS OR dispatchers OR "first responders") ("mental health" OR PTSD OR "peer support" OR benefits OR staffing OR bill) sourcecountry:US sourcelang:english'
    lane: first_responders

  # ---------- Integrative Health & Policy (U.S.) ----------
  - name: Marijuana Moment
    url: https://www.marijuanamoment.net/feed/
    lane: plant_medicine
  - name: Lucid News
    url: https://www.lucid.news/feed/
    lane: plant_medicine
  - name: GDELT · psychedelic therapy
    type: gdelt
    query: '(psilocybin OR MDMA OR ibogaine OR psychedelic) (veterans OR PTSD OR "first responders" OR therapy) sourcecountry:US sourcelang:english'
    lane: plant_medicine
  - name: GDELT · hemp and cannabis policy
    type: gdelt
    query: '(hemp OR cannabis OR THC) (law OR ban OR bill OR regulation OR court) sourcecountry:US sourcelang:english'
    lane: plant_medicine
    kind: policy
