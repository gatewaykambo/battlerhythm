# Battle Rhythm pipeline settings. Safe to edit.

site_name: War Party TOC

# Claude models. The scorer reads every new story, so it uses the faster, cheaper model.
# The drafter writes only for stories that clear the draft threshold.
models:
  scorer: claude-haiku-5-5
  drafter: claude-sonnet-5-5

# Scoring thresholds (out of 100)
thresholds:
  sitrep: 85      # tagged as a Sitrep candidate
  draft: 70       # drafted as a Battle Rhythm Report and sent to the approval queue
  wire: 55        # posted automatically to the Wire as a headline linking to the source

# Stories with any of these flags never post automatically. They wait for an editor's yes or no.
hold_flags:
  - client_conflict
  - foundation
  - war_party
  - suicide
  - graphic

limits:
  max_items_per_feed: 25        # newest items read from each feed per run
  max_age_hours: 72             # ignore stories older than this
  max_drafts_per_run: 15        # cost cap: the top N stories get drafted each run
  score_batch_size: 15          # stories per scoring call
  article_chars: 6000           # how much text the drafter may read from each version of a story
  min_article_chars: 1500       # no TOC Report unless at least this much real article text could be read

queue:
  pending_ttl_hours: 72         # undecided items expire after this
  keep_decided_days: 14         # decided items move to the archive after this
  max_published: 500            # newest Reports kept on the public site
  wire_ttl_hours: 72            # Wire links drop off after this
  max_wire: 400                 # newest Wire links kept
  max_pulled: 200               # pulled stories kept for undo and for the scorer to learn from

editors:
  - Will Wisner
  - Anthony Canania
