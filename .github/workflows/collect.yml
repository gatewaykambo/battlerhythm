# Twice-daily news sweep: find, score, and draft stories, then refresh the site data.
name: Sweep

on:
  schedule:
    - cron: "0 9 * * *"    # about 4 AM Central (3 AM in winter)
    - cron: "0 19 * * *"   # about 2 PM Central (1 PM in winter)
  workflow_dispatch: {}     # the "Run a sweep now" button

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Sweep the news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python pipeline/collect.py
      - name: Apply decisions and rebuild site data
        run: python pipeline/publish.py
      - name: Save results
        run: |
          git config user.name "battle-rhythm-bot"
          git config user.email "battle-rhythm-bot@users.noreply.github.com"
          git add -A data site/data
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -m "Sweep $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
