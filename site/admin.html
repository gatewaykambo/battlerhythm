<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Battle Rhythm · Approval Desk</title>
<meta name="theme-color" content="#141112">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./">
      <span class="wordmark">BATTLE <span>RHYTHM</span></span>
      <span class="tagline">Approval desk · editors only</span>
    </a>
    <div class="clocks" aria-label="Current time">
      <div class="clock z"><span class="lbl">ZULU · DTG</span><span class="t" id="cz">--</span></div>
      <div class="clock ct"><span class="lbl">CENTRAL</span><span class="t" id="cc">--</span></div>
    </div>
    <div class="tools">
      <a class="btn-ghost" href="./" target="_blank" rel="noopener">View site</a>
      <button class="btn-ghost" id="hcBtn" type="button" aria-pressed="false">High contrast</button>
    </div>
  </div>
</header>

<main class="wrap desk">
  <div class="desk-bar">
    <div class="views" role="group" aria-label="Desk views">
      <button class="tab" type="button" data-view="queue" aria-pressed="true">Queue <span class="c" id="qCount"></span></button>
      <button class="tab" type="button" data-view="published" aria-pressed="false">Reports</button>
      <button class="tab" type="button" data-view="wire" aria-pressed="false">Wire</button>
      <button class="tab" type="button" data-view="xscroll" aria-pressed="false">X scroll</button>
      <button class="tab" type="button" data-view="sitrep" aria-pressed="false">Sitrep</button>
      <button class="tab" type="button" data-view="run" aria-pressed="false">Sweeps</button>
      <button class="tab" type="button" data-view="setup" aria-pressed="false">Settings</button>
    </div>
    <span class="who" id="who"></span>
  </div>
  <div id="flash" hidden></div>
  <section id="view"></section>
</main>

<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
